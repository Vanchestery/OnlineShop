# docker-compose.yml — конфигурация для запуска PostgreSQL в Docker.
#
# ─── Зачем Docker в проекте ───────────────────────────────────────────────────
# Раньше PostgreSQL ставился инсталлятором на Windows. Это работает, но:
#   1) у каждого разработчика своя версия PG, свои настройки — "у меня работает,
#      у тебя нет";
#   2) если на машине стоит PG для другого проекта — конфликт по порту 5432;
#   3) тяжело снести и поставить заново.
# Docker решает это: контейнер с PG поднимается за 5 секунд, изолирован от
# системы, версия фиксирована в этом файле — у всех в команде одна и та же база.
#
# ─── Базовые понятия ──────────────────────────────────────────────────────────
#   Образ (image)    — шаблон, из которого создаются контейнеры. postgres:16-alpine
#                      это готовый образ из Docker Hub (~80 MB).
#   Контейнер        — запущенный экземпляр образа. Можно остановить/удалить
#                      и пересоздать из того же образа.
#   Том (volume)     — постоянное хранилище. Если просто удалить контейнер,
#                      данные внутри него теряются. Чтобы база не пропала
#                      между перезапусками — храним её файлы в томе.
#   Port mapping     — внутри контейнера PG слушает 5432. Снаружи (на Windows)
#                      мы пробросим его на 5433 — чтобы не конфликтовать
#                      с твоей локальной установкой PG на 5432.
#
# ─── Как пользоваться ─────────────────────────────────────────────────────────
#   docker compose up -d            # поднять контейнер в фоне (-d = detached)
#   docker compose ps               # посмотреть что запущено
#   docker compose logs -f db       # читать логи PG (Ctrl+C — выход)
#   docker compose stop             # остановить (контейнер и том остаются)
#   docker compose start            # запустить заново уже созданные контейнеры
#   docker compose down             # остановить + удалить контейнер (том ОСТАЁТСЯ)
#   docker compose down -v          # остановить + удалить контейнер И ТОМ
#                                   # (ВНИМАНИЕ: данные БД потеряются!)
#   docker exec -it onlineshop-db psql -U shop -d onlineshop
#                                   # подключиться к PG из терминала
#
# ─── Подключение из приложения и pgAdmin ──────────────────────────────────────
#   Host:     localhost
#   Port:     5433        (не 5432! см. ports ниже)
#   Database: onlineshop
#   User:     shop
#   Password: shop_dev_password
#
# В реальном проекте эти креды должны браться из переменных окружения / Vault,
# а не из коммитнутого файла. Тут — только dev, и пароль безобидный.
# ──────────────────────────────────────────────────────────────────────────────

services:
  db:                                # имя сервиса — так другие сервисы будут его видеть
    image: postgres:16-alpine        # официальный образ PG 16 на Alpine Linux
    container_name: onlineshop-db    # фиксированное имя контейнера для удобства команд
    restart: unless-stopped          # авто-рестарт после падения, но не после `down`

    environment:                     # переменные окружения внутри контейнера.
                                     # PG читает их при первом старте и создаёт
                                     # суперюзера и базу.
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_dev_password
      POSTGRES_DB: onlineshop
      # Кодировка и локаль — важно для русского текста и сортировки.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    ports:
      - "5433:5432"                  # "снаружи:внутри" — подключаемся к localhost:5433

    volumes:
      - postgres-data:/var/lib/postgresql/data
                                     # папка PG внутри контейнера маппится
                                     # на именованный том postgres-data
                                     # (он живёт в хранилище Docker, не в проекте)

    healthcheck:                     # Docker периодически дёргает pg_isready,
                                     # чтобы понимать жив ли контейнер. Пригодится
                                     # когда добавим сервисы которые ждут БД.
      test: ["CMD-SHELL", "pg_isready -U shop -d onlineshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:                     # объявление именованного тома
    name: onlineshop-postgres-data   # явное имя — видно в `docker volume ls`
